apiVersion: apps/v1
kind: Deployment

metadata:
  name: card-processor
  namespace: card-processing

  labels:
    app: card-processor

spec:

  replicas: 2

  selector:
    matchLabels:
      app: card-processor

  template:

    metadata:
      labels:
        app: card-processor

    spec:

      containers:

      - name: card-processor

        image: rvsivakrishna/card-processor:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"
