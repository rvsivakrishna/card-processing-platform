name: Payment API CI

on:
  push:
    branches:
      - feature/github-actions-ci

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: First CI test
        run: echo "Payment API CI pipeline started successfully"

      - name: Build Payment API Docker image
        run: docker build -t payment-api:ci ./applications/payment-api
      
      - name: Run Payment API container
        run: docker run -d --name payment-api-ci -p 8080:8080 payment-api:ci

      - name: Wait for application startup
        run: sleep 5

      - name: Test Payment API health endpoint
        run: curl --fail http://localhost:8080/health
      
      - name: Scan Payment API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: payment-api:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Stop Payment API container
        if: always()
        run: docker rm -f payment-api-ci  